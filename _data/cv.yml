    Projects:
      - name: Adaptive Reasoning and Tool Routing from LLM Hidden States
        summary: Predicting inference-time resource needs from pre-generation representations.
        highlights:
          - Studied whether hidden states can predict when additional reasoning or external tool access is needed before generation.
          - Used Qwen3-1.7B and layer-wise linear probes to predict model-adaptive reasoning and tool necessity.
          - Achieved peak AUROC of 0.881 for reasoning necessity and 0.963 for tool necessity.
          - Evaluated selective routing policies for allocating Thinking and tool access under fixed resource budgets.

      - name: Minimal Chain-of-Thought Reasoning in Low-Resource Languages
        summary: LING 582 – Advanced Statistical Natural Language Processing, University of Arizona
        end_date: 2025
        highlights:
          - Studied whether shorter reasoning traces can preserve LLM reasoning performance in a low-resource language while reducing inference cost.
          - Compared No-CoT, Minimal-CoT, and Standard-CoT using Llama-3-8B-Instruct and Qwen2.5-7B-Instruct across English and Nepali mathematical reasoning.
          - Found that Minimal-CoT retained approximately 95–100% of Standard-CoT accuracy in three of four model-language settings while using 68–81% of its token budget.
          - Analyzed failures involving truncation, semantic grounding, reasoning drift, and repetition.

      - name: Further Pre-training RoBERTa for Negation in Neural Information Retrieval
        summary: CSC 583 – Text Retrieval and Web Search, University of Arizona
        end_date: 2025
        highlights:
          - Examined whether negation-specific further pre-training improves neural retrievers' sensitivity to semantic negation.
          - Evaluated RoBERTa-large on NevIR under no-supervision and fine-tuning settings.
          - Compared negation-focused pre-training methods including NSP, NSPP, and commonsense-based objectives.
          - Achieved a NevIR score of 80.8 with NSP-pretrained RoBERTa-large after fine-tuning, outperforming the reported RankGPT o3-mini result by 3.5 points.

      - name: Interpreting Indirect Answers to Yes-No Questions in Multiple Languages
        summary: Multilingual pragmatic language understanding research, University of Arizona
        highlights:
          - Studied how indirect answers to yes-no questions are interpreted across languages.
          - Contributed to multilingual data collection, validation, and curation, including the Nepali benchmark.
          - Supported evaluation of cross-lingual transfer across eight languages.
          - Resulting work was published in Findings of EMNLP 2023.

      - name: SexTok – Separating Sex Education from Suggestive Content on TikTok
        summary: Multimodal social-media content moderation research, University of Arizona
        highlights:
          - Contributed to dataset annotation for a 1,000-video multimodal TikTok dataset.
          - Helped distinguish sex-educational, sexually suggestive, and other content using visual and linguistic context.
          - Resulting research was published in Findings of ACL 2023.

